apiVersion: v1
kind: ConfigMap
metadata:
  name: streamforge-prometheus-config
  namespace: streamforge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: streamforge-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - streamforge-api.streamforge.svc.cluster.local:8080
